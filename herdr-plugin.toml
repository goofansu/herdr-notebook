id = "herdr-notebook"
name = "Notebook"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Open a plain Markdown notebook for this workspace over the active pane"
platforms = ["linux", "macos"]

[[actions]]
id = "open-notebook"
title = "Open this workspace's notebook"
description = "Open this workspace's Markdown notebook in $EDITOR over the active pane"
contexts = ["workspace"]
command = ["python3", "herdr_notebook.py", "open-notebook"]

[[panes]]
id = "notebook"
title = "Notebook"
placement = "overlay"
command = ["sh", "-c", 'exec ${VISUAL:-${EDITOR:-vi}} "$HERDR_NOTEBOOK_PATH"']
